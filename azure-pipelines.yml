# Azure DevOps Pipeline for ResilienceHub (React/Vite + Express)
# Full-stack mental health application

parameters:
  - name: verifyCustomOrigin
    displayName: 'Verify custom-site freshness after successful deployment'
    type: boolean
    default: false
  - name: customOrigin
    displayName: 'Configured custom HTTPS origin (verification only)'
    type: string
    default: ' '

trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  node_version: '20.x'  # Node.js 20 LTS
  azureSubscription: 'YOUR_SERVICE_CONNECTION_NAME'  # Replace with your service connection
  webAppName: 'resiliencehub-app'  # Replace with your Azure App Service name
  
stages:
  - stage: Build
    displayName: 'Build Application'
    jobs:
      - job: BuildJob
        displayName: 'Build Frontend and Backend'
        steps:
          # Install Node.js
          - task: NodeTool@0
            inputs:
              versionSpec: '$(node_version)'
            displayName: 'Install Node.js $(node_version)'

          # Cache node_modules for faster builds
          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              path: 'node_modules'
              cacheHitVar: 'CACHE_RESTORED'
            displayName: 'Cache npm dependencies'

          # Install dependencies
          - script: |
              npm ci
            displayName: 'Install dependencies (npm ci)'

          # Build Vite frontend
          - script: |
              npm run build
            displayName: 'Build Vite frontend'
            env:
              NODE_ENV: production
              # Add your environment variables here (they'll be set in Azure DevOps)
              # VITE_POSTHOG_KEY: $(VITE_POSTHOG_KEY)
              # VITE_POSTHOG_HOST: $(VITE_POSTHOG_HOST)

          # Package the checker, but never contact the still-live previous release
          # during build. No additional runtime dependencies are needed to verify.
          - ${{ if eq(parameters.verifyCustomOrigin, true) }}:
            - script: |
                node_modules/.bin/esbuild scripts/check-azure-release.ts --bundle --platform=node --format=esm --outfile=dist/check-azure-release.mjs
              displayName: 'Package opt-in post-publish verifier (no network comparison)'

          # Run database migrations (if needed)
          # Uncomment if you need to run migrations during build
          # - script: |
          #     npm run db:push
          #   displayName: 'Run database migrations'
          #   env:
          #     DATABASE_URL: $(DATABASE_URL)

          # Copy all necessary files to staging
          - task: CopyFiles@2
            inputs:
              sourceFolder: '$(Build.SourcesDirectory)'
              contents: |
                **/*
                !node_modules/**
                !.git/**
                !.env*
                !*.md
              targetFolder: '$(Build.ArtifactStagingDirectory)'
              cleanTargetFolder: true
            displayName: 'Copy files to staging directory'

          # Create archive for deployment
          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
              replaceExistingArchive: true
            displayName: 'Create deployment package'

          # Publish build artifacts
          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
              artifactName: 'drop'
              publishLocation: 'Container'
            displayName: 'Publish build artifacts'

  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy to Azure App Service'
        environment: 'production'  # You can create this in Azure Dev
        strategy:
          runOnce:
            deploy:
              steps:
                # Deploy to Azure Web App
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: 'webAppLinux'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
                    runtimeStack: 'NODE|20-lts'
                    startUpCommand: 'npm start'  # Serve the compiled HTML from this ZIP
                  displayName: 'Deploy to Azure App Service'

  # Keep verification separate: a failed check must not erase successful
  # deployment status, redeploy, change DNS, or run while the prior build is live.
  - ${{ if eq(parameters.verifyCustomOrigin, true) }}:
    - stage: VerifyRelease
      displayName: 'Verify custom-site freshness (separate from publish success)'
      dependsOn: Deploy
      condition: succeeded()
      jobs:
        - job: VerifyCustomOrigin
          displayName: 'Check exact published frontend against public origins'
          timeoutInMinutes: 15
          steps:
            - checkout: none
            - task: NodeTool@0
              inputs:
                versionSpec: '$(node_version)'
              displayName: 'Install verification runtime'
            - task: DownloadBuildArtifacts@1
              inputs:
                buildType: 'current'
                downloadType: 'single'
                artifactName: 'drop'
                downloadPath: '$(Pipeline.Workspace)'
              displayName: 'Download the exact ZIP used by the successful Deploy stage'
            - task: AzureCLI@2
              displayName: 'Freshness result: matching / mismatch / stale / unavailable'
              inputs:
                azureSubscription: '$(azureSubscription)'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                addSpnToEnvironment: false
                visibleAzLogin: false
                inlineScript: |
                  set -euo pipefail
                  echo "Azure deployment succeeded. Custom-site verification is a separate result."
                  work="$(mktemp -d)"
                  trap 'rm -rf "$work"' EXIT
                  if ! unzip -p "$(Pipeline.Workspace)/drop/$(Build.BuildId).zip" dist/check-azure-release.mjs > "$work/check.mjs" 2>/dev/null ||
                     ! unzip -p "$(Pipeline.Workspace)/drop/$(Build.BuildId).zip" dist/public/index.html > "$work/index.html" 2>/dev/null; then
                    echo '##vso[task.logissue type=error;code=release_unavailable;]Freshness unavailable: the exact published ZIP or HTML could not be read. Deployment succeeded separately.'
                    exit 2
                  fi
                  node "$work/check.mjs" --app-name "$RELEASE_APP_NAME" --custom "$RELEASE_CUSTOM_ORIGIN" --expected-html "$work/index.html"
              env:
                RELEASE_APP_NAME: $(webAppName)
                RELEASE_CUSTOM_ORIGIN: ${{ parameters.customOrigin }}

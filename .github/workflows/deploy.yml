name: CBT Auto Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.19.1
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: Build Project
        run: npm run build

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      # The key in CBT_DEPLOY_KEY can only run `sudo cbt-deploy` on the server (a forced command
      # for the account cbt-ci). That script clones main from GitHub with this run's read-only
      # token, checks it for malware and builds it as the unprivileged account cbt-web, so
      # nothing in this workflow decides what runs on the server. See DEPLOY.md.
      - name: Run the server's deploy script
        env:
          DEPLOY_KEY: ${{ secrets.CBT_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '20.62.161.79 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL4Wh1UYoxQorvUdDJSD0+YIEFji8/Er5JJtXIG3/H58' > ~/.ssh/known_hosts
          # The token goes on stdin, not the command line; it expires when this job ends.
          printf '%s\n' "$GITHUB_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes cbt-ci@20.62.161.79 deploy

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: [build, deploy-production]
    if: failure()  # ✅ Only runs if any of the above jobs fail
    steps:
      - name: Send Failure Email via SparkPost
        run: |
          echo "Sending email notification..."
          curl -X POST "https://api.sparkpost.com/api/v1/transmissions" \
            -H "Authorization: ${{ secrets.SPARKPOST_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "options": { "sandbox": false },
              "content": {
                "from": { "email": "'"${{ secrets.SPARKPOST_SENDER }}"'" },
                "subject": "🚨 GitHub Action Failed: '"${{ github.workflow }}"'",
                "text": "The workflow *'"${{ github.workflow }}"'* failed on branch *'"${{ github.ref }}"'*.\\n\\nCheck details: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"
              },
              "recipients": [{ "address": "'"${{ secrets.ALERT_EMAIL }}"'" }]
            }'
